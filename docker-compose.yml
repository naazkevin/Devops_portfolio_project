version: '3.8'

services:
  portfolio-app:
    build: ./Phase_2_CI
    container_name: portfolio-app
    ports:
      - "3000:3000"
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge