apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app-deployment
  labels:
    app: portfolio-web
spec:
  # Tell Kubernetes to run 2 identical copies of our container for high availability
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      containers:
      - name: web-app
        # Point this directly to your public Docker Hub image built in Phase 2
        image: naaz123kevin/portfolio-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000