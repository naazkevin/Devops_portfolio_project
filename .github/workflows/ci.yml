name: End-to-End DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    
    # 1. Add write permissions so the workflow can commit and push back to repo
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up Node.js environment on the runner
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Step 3: Install dependencies inside your exact folder path
    - name: Install Application Dependencies
      run: |
        cd Phase_2_CI
        npm install

    # Step 4: Run the automated security scan using Snyk CLI
    - name: Run Snyk Security Vulnerability Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        cd Phase_2_CI
        npx snyk test --severity-threshold=high

    # Step 5: Initialize Docker's build environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 6: Log in securely to your public Docker Hub registry
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 7: Build and push the container using the exact folder context
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./Phase_2_CI
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-app:${{ github.sha }}

    # Step 8: Automatically update deployment.yaml with the new commit SHA tag
    - name: Update image tag in deployment.yaml
      run: |
        sed -i 's|image: naaz123kevin/portfolio-app:.*|image: naaz123kevin/portfolio-app:${{ github.sha }}|g' Phase_3_CD\(Argo\)/deployment.yaml

    # Step 9: Commit and push the updated deployment.yaml back to GitHub
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add Phase_3_CD\(Argo\)/deployment.yaml
        git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
        git push