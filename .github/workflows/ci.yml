name: End-to-End DevOps CI Pipeline

# 1. TRIGGER: Run this script automatically every time someone pushes code to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    # Tell GitHub to spin up a fresh, temporary Ubuntu Linux machine in the cloud
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your repository code onto the runner machine
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up Node.js environment on the runner
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Step 3: Install dependencies inside the Phase 2 directory
    - name: Install Application Dependencies
      run: |
        cd Phase_2_CICD
        npm install

    # Step 4: Run the automated security scan using Snyk CLI
    - name: Run Snyk Security Vulnerability Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        cd Phase_2_CICD
        npx snyk test --severity-threshold=high


    # Step 5: Initialize Docker's build environment
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 6: Log in securely to your public Docker Hub registry
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 7: Build and push the container to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./Phase_2_CICD
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-app:${{ github.sha }}
